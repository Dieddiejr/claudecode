    <div class="card b"><div class="vis"><img alt="[[G03_C3_PHOTO_DESCRIPTION]]" src="{{img:@portrait}}" style="object-position:50% 50%"></div><div class="stack"><p class="s">[[G03_C3_TITRE]]</p><p class="x">[[G03_C3_TEXTE]]</p></div></div>
