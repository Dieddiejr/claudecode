<!-- =====================================================================
     G05 · LISTE NUMÉROTÉE : carte titre + photo à gauche, liste de 3 à 5 lignes à droite.
     Images : 1 photo PAYSAGE (format 16:10).
     Les numéros (01, 02...) s'écrivent directement dans <span class="n">.
     ===================================================================== -->
<section class="page side" data-nom="liste"><div class="in">
  <div class="card g">
    <span class="label">[[G05_ETIQUETTE]]</span>
    <div class="stack end">
      <h2>[[G05_TITRE]]</h2>
      <p class="x">[[G05_SOUS_TITRE]]</p>
    </div>
    <div class="side-ph"><img alt="[[G05_PHOTO_DESCRIPTION]]" src="{{img:@paysage}}" style="object-position:50% 50%"></div>
  </div>
  <div class="card y"><div class="list">
    <div class="row"><span class="n">01</span><p class="t">[[G05_L1_TITRE]]</p><p class="d">[[G05_L1_TEXTE]]</p></div>
    <div class="row"><span class="n">02</span><p class="t">[[G05_L2_TITRE]]</p><p class="d">[[G05_L2_TEXTE]]</p></div>
    <div class="row"><span class="n">03</span><p class="t">[[G05_L3_TITRE]]</p><p class="d">[[G05_L3_TEXTE]]</p></div>
    <div class="row"><span class="n">04</span><p class="t">[[G05_L4_TITRE]]</p><p class="d">[[G05_L4_TEXTE]]</p></div>
    <div class="row"><span class="n">05</span><p class="t">[[G05_L5_TITRE]]</p><p class="d">[[G05_L5_TEXTE]]</p></div>
  </div></div>
</div></section>
